<header>
  <mat-toolbar class="flex justify-between items-center">
    <!-- Left side/logo section -->
    <div>
      <img
        class="w-64"
        src="/assets/Logo Original.png"
        alt="Company Logo"
      />
    </div>
    <!-- Main navbar links section -->
    <div
      class="lg:static absolute lg:min-h-fit min-h-[30vh] left-0 top-[-100%] lg:w-auto w-full flex items-center px-5"
    >
      <ul class="flex lg:flex-row flex-col lg:items-center lg:gap-[3vw] gap-6">
        <!-- Aduit Status link -->
        <li>
          <a
            class="text-[#66CC33] hover:text-[#414551]"
            routerLink="/status"
            routerLinkActive="active"
            >Audit Status</a
          >
        </li>
        <!-- Aduit Upload link -->
        <li>
          <a
            class="text-[#66CC33] hover:text-[#414551]"
            routerLink="/make-an-audit"
            routerLinkActive="active"
            >Audit Upload</a
          >
        </li>
      </ul>
    </div>
    <!-- Right side/user buttons section -->
    <div>
      <div class="hidden lg:block">
        <!-- Profile button for larger viewports -->
        <a routerLink="/profile">
          <button mat-flat-button>Profile</button>
        </a>
        <!-- Profile button for larger viewports -->
        <button class="ml-2" mat-flat-button (click)="logout()">Logout</button>
      </div>
      <!-- Menu button for smaller viewports -->
      <div class="lg:hidden">
        <button
          mat-icon-button
          [matMenuTriggerFor]="menu"
          aria-label="menu button"
        >
          <mat-icon>menu</mat-icon>
        </button>
        <!-- Hamburger dropdown menu for smaller viewports -->
        <mat-menu #menu="matMenu">
          <!-- Audit Status button in the dropdown menu -->
          <a routerLink="/status">
            <button mat-menu-item>
              <mat-icon>check_circle</mat-icon>
              <span>Status</span>
            </button>
          </a>
          <!-- Audit Upload button in the dropdown menu -->
          <a routerLink="/make-an-audit">
            <button mat-menu-item>
              <mat-icon>create</mat-icon>
              <span>Make an Audit</span>
            </button>
          </a>
          <!-- Profile button in the dropdown menu -->
          <a routerLink="/profile">
            <button mat-menu-item>
              <mat-icon>person_pin</mat-icon>
              <span>Profile</span>
            </button>
          </a>
          <!-- Logout button in the dropdown menu -->
          <button mat-menu-item (click)="logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </mat-toolbar>
</header>
